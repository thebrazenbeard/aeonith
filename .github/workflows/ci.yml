name: Aeonith contract tests

on:
  push:
    branches: [main, "build/**"]
  pull_request:

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run contract and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Validate JSON schemas
        run: |
          python -m json.tool aeonith/schemas/capability-envelope-v1.schema.json > /dev/null
          python -m json.tool aeonith/schemas/capability-result-v1.schema.json > /dev/null
      - name: Compile source
        run: python -m compileall -q aeonith capability_adapter.py

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeonith"
version = "0.8.0"
description = "Evidence-aware, provider-neutral literary critique engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aeonith = "aeonith.__main__:main"
aeonith-critique = "aeonith.workflow:main"
aeonith-longform = "aeonith.longform:main"

[tool.setuptools]
py-modules = ["capability_adapter"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aeonith*", "api*"]

[tool.setuptools.package-data]
aeonith = ["schemas/*.json"]

[tool.setuptools.data-files]
"share/aeonith" = ["public/index.html", "public/app.js", "public/styles.css", "public/docx-import-worker.js"]
